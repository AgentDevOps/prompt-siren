[project]
name = "latent-risk"
version = "0.1.0"
description = "Hidden high-risk states in attack-failed agent trajectories: attack-chain extraction, attribution, checkpoint replay and self-evolving attribution"
authors = [{ name = "Xiaoliang Zhang" }]
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.19.1",
    "numpy",
    "pydantic>=2",
    "pydantic-ai-slim>=1.1.0",
    "pyyaml>=6.0.2",
    "scipy",
]

[project.optional-dependencies]
# attack-chain topic retrieval (BERTopic clustering of trajectory units)
topics = ["bertopic==0.17.4"]

[build-system]
requires = ["uv_build>=0.8.2,<0.12.0"]
build-backend = "uv_build"
