# mini-swe overlay for MODEL=muse in prepare_datasets.sh, merged over the gpt settings (gpt5.yaml):
# only the model changes. Meta is the model's only OpenRouter host today; pinning it without fallback
# keeps it so if others are added (an outage fails the call).
model:
  model_name: openrouter/meta/muse-spark-1.3-contributor
  # litellm has no price for this model; cost tracking would stop the run
  cost_tracking: ignore_errors
  model_kwargs:
    extra_body:
      provider:
        order: [meta]
        allow_fallbacks: false
