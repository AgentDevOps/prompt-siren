# mini-swe overlay for MODEL=glm in prepare_datasets.sh, merged over the gpt settings (gpt5.yaml):
# only the model changes. OpenRouter serves this model from ~40 hosts, most of them fp4/fp8
# quantised; every call goes to Z.ai's own endpoint (fp8), without fallback, so the calls of one
# run, and replays vs. fresh runs, hit the same weights.
model:
  model_name: openrouter/z-ai/glm-5.3-flash
  # litellm may have no price for this model; cost tracking would stop the run
  cost_tracking: ignore_errors
  model_kwargs:
    extra_body:
      provider:
        order: [z-ai]
        allow_fallbacks: false
